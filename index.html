<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        As Cronicas de Aetherion
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div id="jogo">

        <header>

            <h1>
                AS CRONICAS DE AETHERION
            </h1>

            <p>
                A Queda do Rei Sombrio
            </p>

        </header>


        <main>

            <img
                id="imagem-cena"
                src="https://assets/imagens/"
                alt="Tela inicial"
            >


            <h2 id="titulo-cena">

                Carregando...

            </h2>


            <p id="texto-cena">

            </p>


            <div id="opcoes">

                <button id="opcao1">
                    Opcao 1
                </button>

                <button id="opcao2">
                    Opcao 2
                </button>

                <button id="opcao3">
                    Opcao 3
                </button>

                <button id="opcao4">
                    Opcao 4
                </button>

            </div>


            <div id="botoes-jogo">

                <button id="checkpoint">
                    VOLTAR AO CHECKPOINT
                </button>


                <button id="reiniciar">
                    REINICIAR JOGO
                </button>

            </div>

        </main>

    </div>


    <audio
        id="audio-fundo"
        loop
    ></audio>


    <script src="script.js"></script>

</body>

</html>
